# Routing mirrors upstream ZITADEL compose labels. Static files cannot interpolate env vars,
# so the host is the literal `localhost` (Traefik Host() ignores the port); change if ZITADEL_DOMAIN changes.
http:
  routers:
    zitadel-root:
      rule: Host(`localhost`) && Path(`/`)
      entryPoints: [web]
      middlewares: [zitadel-root-rewrite]
      service: zitadel-login
      priority: 400
    zitadel-login:
      rule: Host(`localhost`) && PathPrefix(`/ui/v2/login`)
      entryPoints: [web]
      service: zitadel-login
      priority: 250
    zitadel-api-alias:
      rule: Host(`localhost`) && PathPrefix(`/api`)
      entryPoints: [web]
      middlewares: [zitadel-strip-api]
      service: zitadel-api
      priority: 200
    zitadel-canonical:
      rule: Host(`localhost`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/api`) && !Path(`/`)
      entryPoints: [web]
      service: zitadel-api
      priority: 100
  middlewares:
    zitadel-root-rewrite:
      replacePath:
        path: /ui/v2/login/
    zitadel-strip-api:
      stripPrefix:
        prefixes: [/api]
        forceSlash: false
  services:
    zitadel-login:
      loadBalancer:
        servers:
          - url: http://zitadel-login:3000
    zitadel-api:
      loadBalancer:
        servers:
          - url: h2c://zitadel-api:8080
